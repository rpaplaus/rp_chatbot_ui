server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    # Security Headers (CSP & Hardening). Re-included in every location that sets its own
    # headers, because nginx drops inherited add_header directives in that case.
    include /etc/nginx/snippets/security-headers.conf;


    # Proxy API & SSE requests when accessed directly via port 5185
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Disable buffering for Server-Sent Events (SSE)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # PWA: service worker, its registration script and the manifest must always be revalidated,
    # otherwise clients keep running an outdated app shell.
    location ~* ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        # nginx's default mime.types has no entry for .webmanifest
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA Fallback Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}

