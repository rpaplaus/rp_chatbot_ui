# =============================================================================
# Networks
# =============================================================================
networks:
  rp_network:
    name: rp_network
    driver: bridge

# =============================================================================
# Persistent Volumes
# =============================================================================
volumes:
  rp_postgres_data:
    name: rp_postgres_data
  rp_redis_data:
    name: rp_redis_data
  rp_caddy_data:
    name: rp_caddy_data
  rp_caddy_config:
    name: rp_caddy_config

# =============================================================================
# Services
# =============================================================================
services:

  # ---------------------------------------------------------------------------
  # 1. Reverse Proxy & Ingress Gateway (Caddy)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: rp_caddy
    restart: unless-stopped
    ports:
      - "${CADDY_PORT:-8085}:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - rp_caddy_data:/data
      - rp_caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - rp_network

  # ---------------------------------------------------------------------------
  # 2. Relational Database (PostgreSQL 16 + pgvector)
  # ---------------------------------------------------------------------------
  database:
    image: pgvector/pgvector:pg16
    container_name: rp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rp_secure_postgres_pass}
      POSTGRES_DB: ${POSTGRES_DB:-rp_chatbot}
    ports:
      - "${POSTGRES_PORT:-5438}:5432"
    volumes:
      - rp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rp_admin} -d ${POSTGRES_DB:-rp_chatbot}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - rp_network

  # ---------------------------------------------------------------------------
  # 3. Cache & Session Storage (Redis 7)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rp_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-rp_secure_redis_pass}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6388}:6379"
    volumes:
      - rp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-rp_secure_redis_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - rp_network

  # ---------------------------------------------------------------------------
  # 4. Backend Service (FastAPI)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rp_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-rp_admin}:${POSTGRES_PASSWORD:-rp_secure_postgres_pass}@database:5432/${POSTGRES_DB:-rp_chatbot}}
      REDIS_URL: ${REDIS_URL:-redis://:${REDIS_PASSWORD:-rp_secure_redis_pass}@redis:6379/0}
      PORT: "8000"
    ports:
      - "${BACKEND_PORT:-8002}:8000"
    volumes:
      - ./data/uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rp_network

  # ---------------------------------------------------------------------------
  # 5. Frontend Service (React / Vite)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rp_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5185}:80"
    networks:
      - rp_network

  # ---------------------------------------------------------------------------
  # 6. Legacy Monolith Service (Gradio) - Optional during migration
  # ---------------------------------------------------------------------------
  legacy_gradio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rp_gradio_legacy
    restart: "no"
    ports:
      - "7860:7860"
    volumes:
      - ./memory:/app/memory
    env_file:
      - .env
    profiles:
      - legacy
